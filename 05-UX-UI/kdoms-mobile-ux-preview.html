.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

.kdoms-overlay { position: absolute; z-index: 20; inset: 0; display: flex; align-items: flex-end; background: var(--kdoms-overlay); }
.kdoms-overlay[hidden] { display: none; }
.kdoms-sheet,

.kdoms-sheet-handle { width: 42px; height: 4px; margin: 0 auto 13px; border-radius: 4px; background: var(--kdoms-border); }
.kdoms-sheet-title small,
.kdoms-scan-heading small { color: var(--kdoms-green-strong); font-size: .68rem; font-weight: 700; }
.kdoms-sheet-title h2,
.kdoms-scan-heading h2 { margin: 2px 0 0; font-size: 1.02rem; }
.kdoms-sheet-title button,
.kdoms-scan-heading &gt; button { width: 44px; height: 44px; border: 0; border-radius: 13px; background: var(--kdoms-surface-soft); color: var(--kdoms-text); font-size: 1.4rem; }
.kdoms-farm-option { width: 100%; min-height: 68px; margin-top: 10px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 11px; padding: 10px; border: 1px solid var(--kdoms-border); border-radius: 15px; background: var(--kdoms-surface); color: var(--kdoms-text); text-align: left; }
.kdoms-farm-option.is-selected { border-color: var(--kdoms-green); background: var(--kdoms-green-soft); }
.kdoms-farm-letter { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: var(--kdoms-green); color: light-dark(#ffffff, #0c2413); font-weight: 800; }
.kdoms-farm-letter.is-gold { background: var(--kdoms-gold); color: light-dark(#ffffff, #2d2200); }
.kdoms-farm-option &gt; span:nth-child(2) { display: grid; }

.kdoms-check { color: var(--kdoms-green-strong); font-weight: 800; }
.kdoms-sheet-note { margin: 14px 0 0; color: var(--kdoms-muted); text-align: center; font-size: .68rem; }
.kdoms-confirm-overlay { z-index: 24; }

.kdoms-confirm-mark { width: 52px; height: 52px; margin: 4px auto; display: grid; place-items: center; border-radius: 50%; background: var(--kdoms-amber-soft); color: var(--kdoms-amber); font-size: 1.4rem; font-weight: 800; }
.kdoms-confirm-actions { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.kdoms-confirm-actions button { min-height: 44px; border: 0; border-radius: 12px; font-weight: 800; }
.kdoms-confirm-actions button:first-child { background: var(--kdoms-surface-soft); color: var(--kdoms-text); }
.kdoms-confirm-actions button:last-child { background: var(--kdoms-green); color: light-dark(#ffffff, #0c2413); }

.kdoms-scan-sheet { min-height: 620px; }
.kdoms-scan-heading { justify-content: flex-start; margin-bottom: 14px; }
.kdoms-camera { height: 310px; display: grid; place-items: center; align-content: center; gap: 20px; border-radius: 21px; background: light-dark(#243c2b, #0a0f0c); color: light-dark(#ffffff, #e9f5ec); }
.kdoms-camera p { margin: 0; font-size: .75rem; opacity: .84; }
.kdoms-scan-frame { position: relative; width: 190px; height: 190px; }
.kdoms-scan-frame &gt; span { position: absolute; width: 42px; height: 42px; border-color: light-dark(#9ee4ad, #75d28a); border-style: solid; }
.kdoms-scan-frame &gt; span:nth-child(1) { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 12px 0 0; }
.kdoms-scan-frame &gt; span:nth-child(2) { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 12px 0 0; }
.kdoms-scan-frame &gt; span:nth-child(3) { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 12px; }
.kdoms-scan-frame &gt; span:nth-child(4) { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 12px; }
.kdoms-scan-frame b { position: absolute; top: 50%; left: 10px; right: 10px; height: 2px; background: light-dark(#9ee4ad, #75d28a); box-shadow: 0 0 12px light-dark(rgba(158,228,173,.8), rgba(117,210,138,.7)); }
.kdoms-scan-sheet .kdoms-full-primary { margin-top: 12px; }
.kdoms-manual-entry { margin-top: 13px; }
.kdoms-manual-entry &gt; span { color: var(--kdoms-muted); font-size: .68rem; }
.kdoms-manual-entry &gt; div { margin-top: 6px; display: flex; gap: 7px; }
.kdoms-manual-entry input { min-width: 0; flex: 1; min-height: 44px; padding: 9px 10px; border: 1px solid var(--kdoms-border); border-radius: 11px; background: var(--kdoms-page); color: var(--kdoms-text); font-size: 1rem; }
.kdoms-manual-entry button { min-height: 44px; padding: 8px 11px; border: 0; border-radius: 11px; background: var(--kdoms-surface-soft); color: var(--kdoms-green-strong); font-size: .74rem; font-weight: 700; }
.kdoms-manual-entry p { margin: 6px 0 0; color: var(--kdoms-red); font-size: .7rem; }
.kdoms-scan-result { padding-top: 35px; text-align: center; }
.kdoms-result-mark { width: 72px; height: 72px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; background: var(--kdoms-green-soft); color: var(--kdoms-green-strong); font-size: 2rem; font-weight: 800; }
.kdoms-scan-result.is-mismatch .kdoms-result-mark { background: var(--kdoms-red-soft); color: var(--kdoms-red); }
.kdoms-scan-result &gt; small { color: var(--kdoms-green-strong); font-size: .72rem; font-weight: 700; }
.kdoms-scan-result.is-mismatch &gt; small { color: var(--kdoms-red); }
.kdoms-scan-result h3 { margin: 5px 0; font-size: 1.25rem; }
.kdoms-scan-result code { color: var(--kdoms-muted); font-size: .72rem; }
.kdoms-result-location { margin: 17px 0 10px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.kdoms-result-location span { padding: 10px 5px; border-radius: 11px; background: var(--kdoms-surface-soft); font-size: .72rem; font-weight: 700; }
.kdoms-scan-result p { color: var(--kdoms-muted); font-size: .75rem; }
.kdoms-expected-actual { display: grid; gap: 5px; margin: 10px 0; padding: 10px; border-radius: 11px; background: var(--kdoms-red-soft); text-align: left; font-size: .68rem; }
.kdoms-expected-actual code { overflow-wrap: anywhere; color: var(--kdoms-red); }
.kdoms-text-action { min-height: 44px; margin-top: 7px; border: 0; background: transparent; color: var(--kdoms-green-strong); font-weight: 700; }

.kdoms-toast { position: absolute; z-index: 30; left: 18px; right: 18px; bottom: 88px; padding: 11px 13px; border-radius: 13px; background: var(--kdoms-text); color: var(--kdoms-page); text-align: center; font-size: .74rem; box-shadow: var(--kdoms-shadow); }
.kdoms-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

@media (max-width: 460px) {
  .kdoms-device { width: 100%; min-height: 740px; border-radius: 22px; }
}

@media (max-width: 360px) {
  .kdoms-header,
  .kdoms-page { padding-left: 13px; padding-right: 13px; }
  .kdoms-sync-button { width: 82px; }
  .kdoms-farm-code { display: none; }
  .kdoms-quick-actions { grid-template-columns: 1fr; }
  .kdoms-task-bottom { align-items: flex-start; }
  .kdoms-task-bottom &gt; span { max-width: 45%; }
  .kdoms-tree-hero { grid-template-columns: 78px 1fr; }
  .kdoms-tree-photo { height: 78px; }
  .kdoms-manual-entry &gt; div { flex-direction: column; }
  .kdoms-form-grid,
  .kdoms-verify-actions,
  .kdoms-rework-form &gt; div { grid-template-columns: 1fr; }
}
&lt;/style&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#39;kdoms-prototype&#39;);
  if (!root) return;
  root.ownerDocument.documentElement.dataset.theme = &#39;light&#39;;
  root.style.colorScheme = &#39;light&#39;;

  const farms = {
    farm1: { name: &#39;สวนก้องลักษณ์&#39;, code: &#39;KGL-F01&#39;, role: &#39;เจ้าของสวน&#39;, trees: &#39;612&#39;, tasks: &#39;7&#39;, watch: &#39;5&#39;, urgent: &#39;2&#39;, fruit: &#39;4,280&#39; },
    farm2: { name: &#39;สวนเนินทอง&#39;, code: &#39;KGL-F02&#39;, role: &#39;ผู้จัดการ&#39;, trees: &#39;286&#39;, tasks: &#39;4&#39;, watch: &#39;2&#39;, urgent: &#39;1&#39;, fruit: &#39;1,940&#39; }
  };

  let currentFarm = &#39;farm1&#39;;
  let currentPage = &#39;home&#39;;
  let offline = false;
  let pendingFarmKey = null;
  let photoAdded = false;
  let darkMode = false;
  const pendingByFarm = { farm1: 0, farm2: 0 };
  let toastTimer;

  const pages = [...root.querySelectorAll(&#39;[data-page]&#39;)];
  const navButtons = [...root.querySelectorAll(&#39;.kdoms-nav [data-go]&#39;)];
  const farmOverlay = root.querySelector(&#39;[data-farm-overlay]&#39;);
  const switchOverlay = root.querySelector(&#39;[data-switch-overlay]&#39;);
  const scanOverlay = root.querySelector(&#39;[data-scan-overlay]&#39;);
  const scanCamera = root.querySelector(&#39;[data-scan-camera]&#39;);
  const scanResult = root.querySelector(&#39;[data-scan-result]&#39;);
  const scanError = root.querySelector(&#39;[data-scan-error]&#39;);
  const toast = root.querySelector(&#39;[data-toast]&#39;);

  function setText(selector, value) {
    root.querySelectorAll(selector).forEach((node) =&gt; { node.textContent = value; });
  }

  function showToast(message) {
    clearTimeout(toastTimer);
    toast.textContent = message;
    toast.hidden = false;
    toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 2400);
  }

  function goTo(pageName) {
    currentPage = pageName;
    pages.forEach((page) =&gt; {
      const active = page.dataset.page === pageName;
      page.hidden = !active;
      page.classList.toggle(&#39;is-active&#39;, active);
    });
    navButtons.forEach((button) =&gt; {
      const target = button.dataset.go;
      const navPage = pageName === &#39;tree-detail&#39; ? &#39;trees&#39; :
        ([&#39;worker-report&#39;, &#39;manager-verify&#39;].includes(pageName) ? &#39;tasks&#39; : pageName);
      button.classList.toggle(&#39;is-active&#39;, target === navPage);
    });
    root.querySelector(&#39;.kdoms-main&#39;).scrollTop = 0;
  }

  function updateSyncIndicator() {
    const count = pendingByFarm[currentFarm];
    const label = offline ? `ออฟไลน์ &#183; ${count}` : (count &gt; 0 ? `รอซิงก์ &#183; ${count}` : &#39;ซิงก์แล้ว&#39;);
    setText(&#39;[data-sync-label]&#39;, label);
    root.querySelector(&#39;[data-action=&quot;toggle-sync&quot;]&#39;).setAttribute(&#39;aria-pressed&#39;, String(offline));
  }

  function applyFarm(farmKey) {
    currentFarm = farmKey;
    const farm = farms[farmKey];
    setText(&#39;[data-farm-name]&#39;, farm.name);
    setText(&#39;[data-farm-code]&#39;, farm.code);
    setText(&#39;[data-scan-farm-code]&#39;, farm.code);
    setText(&#39;[data-role]&#39;, farm.role);
    setText(&#39;[data-tree-count]&#39;, farm.trees);
    setText(&#39;[data-task-count]&#39;, farm.tasks);
    setText(&#39;[data-watch-count]&#39;, farm.watch);
    setText(&#39;[data-urgent-count]&#39;, farm.urgent);
    setText(&#39;[data-fruit-count]&#39;, farm.fruit);
    const treeCode = `${farm.code}-Z01-R03-T017`;
    setText(&#39;[data-task-tree]&#39;, treeCode);
    setText(&#39;[data-tree-code]&#39;, treeCode);
    setText(&#39;[data-report-tree-code]&#39;, treeCode);
    setText(&#39;[data-verify-tree-code]&#39;, treeCode);
    root.querySelector(&#39;[data-manual-code]&#39;).placeholder = `เช่น ${treeCode}`;
    root.querySelectorAll(&#39;[data-select-farm]&#39;).forEach((button) =&gt; {
      const selected = button.dataset.selectFarm === farmKey;
      button.classList.toggle(&#39;is-selected&#39;, selected);
      button.querySelector(&#39;.kdoms-check&#39;).textContent = selected ? &#39;✓&#39; : &#39;&#39;;
    });
    updateSyncIndicator();
  }

  function openFarmPicker() {
    farmOverlay.hidden = false;
    root.querySelector(&#39;[data-action=&quot;open-farms&quot;]&#39;).setAttribute(&#39;aria-expanded&#39;, &#39;true&#39;);
    root.querySelector(&#39;[data-action=&quot;close-farms&quot;]&#39;).focus();
  }

  function closeFarmPicker() {
    farmOverlay.hidden = true;
    root.querySelector(&#39;[data-action=&quot;open-farms&quot;]&#39;).setAttribute(&#39;aria-expanded&#39;, &#39;false&#39;);
  }

  function applyFarmSwitch(selected, hadPending) {
    const sourceCode = farms[currentFarm].code;
    applyFarm(selected);
    closeFarmPicker();
    switchOverlay.hidden = true;
    pendingFarmKey = null;
    goTo(&#39;home&#39;);
    showToast(hadPending
      ? `เปลี่ยนสวนแล้ว — รายการรอซิงก์ยังคงอยู่ที่ ${sourceCode}`
      : `เปลี่ยนเป็น ${farms[selected].name} แล้ว`);
  }

  function requestFarmSwitch(selected) {
    if (selected === currentFarm) {
      closeFarmPicker();
      return;
    }
    const pendingCount = pendingByFarm[currentFarm];
    if (offline || pendingCount &gt; 0) {
      pendingFarmKey = selected;
      setText(&#39;[data-pending-source]&#39;, farms[currentFarm].code);
      setText(&#39;[data-pending-target]&#39;, farms[selected].code);
      setText(&#39;[data-pending-count]&#39;, String(pendingCount));
      closeFarmPicker();
      switchOverlay.hidden = false;
      root.querySelector(&#39;[data-action=&quot;cancel-farm-switch&quot;]&#39;).focus();
      return;
    }
    applyFarmSwitch(selected, false);
  }

  function resetScan() {
    scanCamera.hidden = false;
    scanResult.hidden = true;
    scanResult.classList.remove(&#39;is-mismatch&#39;);
    scanError.hidden = true;
    root.querySelector(&#39;[data-manual-code]&#39;).value = &#39;&#39;;
  }

  function openScan() {
    resetScan();
    scanOverlay.hidden = false;
  }

  function closeScan() { scanOverlay.hidden = true; }

  function parseTagCode(code) {
    const match = /^([A-Z0-9]+)-(F\d+)-(Z\d+)-(R\d+)-(T\d+)$/.exec(code);
    if (!match) return null;
    return {
      organizationCode: match[1],
      farmSequence: match[2],
      farmCode: `${match[1]}-${match[2]}`,
      zone: match[3],
      row: match[4],
      tree: match[5]
    };
  }

  function showScanResult(code) {
    const farm = farms[currentFarm];
    const parsed = parseTagCode(code);
    const expected = `${farm.code}-Z01-R03-T017`;
    const matches = code === expected;
    scanCamera.hidden = true;
    scanResult.hidden = false;
    scanResult.classList.toggle(&#39;is-mismatch&#39;, !matches);
    root.querySelector(&#39;[data-result-mark]&#39;).textContent = matches ? &#39;✓&#39; : &#39;!&#39;;
    root.querySelector(&#39;[data-result-kicker]&#39;).textContent = matches ? &#39;พบต้นที่ตรงกับใบงาน&#39; : &#39;ป้ายนี้ไม่ตรงกับใบงาน&#39;;
    root.querySelector(&#39;[data-result-title]&#39;).textContent = matches ? `ต้น ${parsed.tree} &#183; หมอนทอง` : `ตรวจพบต้น ${parsed.tree}`;
    root.querySelector(&#39;[data-result-code]&#39;).textContent = code;
    setText(&#39;[data-result-farm]&#39;, `สวน ${parsed.farmCode}`);
    setText(&#39;[data-result-zone]&#39;, `โซน ${parsed.zone}`);
    setText(&#39;[data-result-row]&#39;, `แถว ${parsed.row}`);
    setText(&#39;[data-result-tree]&#39;, `ตำแหน่ง ${parsed.tree}`);
    const comparison = root.querySelector(&#39;[data-expected-actual]&#39;);
    comparison.hidden = matches;
    setText(&#39;[data-expected-code]&#39;, expected);
    setText(&#39;[data-actual-code]&#39;, code);
    root.querySelector(&#39;[data-result-message]&#39;).textContent = matches
      ? &#39;ตรวจรหัสและสวนแล้ว สามารถเปิดข้อมูลต้นหรือเริ่มงานได้&#39;
      : `ใบงานต้องทำ ${expected} แต่สแกนจริง ${code} ระบบหยุดงานเดิมแล้ว`;
    root.querySelector(&#39;[data-action=&quot;open-scanned-tree&quot;]&#39;).hidden = !matches;
  }

  function runManualScan() {
    const input = root.querySelector(&#39;[data-manual-code]&#39;);
    const code = input.value.trim().toUpperCase();
    const parsed = parseTagCode(code);
    if (!code) {
      scanError.textContent = &#39;กรุณากรอกรหัสบนป้าย&#39;;
      scanError.hidden = false;
      return;
    }
    if (!parsed) {
      scanError.textContent = &#39;รูปแบบรหัสไม่ถูกต้อง ตัวอย่าง KGL-F01-Z01-R03-T017&#39;;
      scanError.hidden = false;
      return;
    }
    scanError.hidden = true;
    showScanResult(code);
  }

  function resetVerification() {
    root.querySelector(&#39;[data-verify-actions]&#39;).hidden = false;
    root.querySelector(&#39;[data-rework-form]&#39;).hidden = true;
    root.querySelector(&#39;[data-verification-result]&#39;).hidden = true;
    root.querySelector(&#39;[data-rework-error]&#39;).hidden = true;
    root.querySelector(&#39;[data-rework-reason]&#39;).value = &#39;&#39;;
    setText(&#39;[data-verify-status]&#39;, offline ? &#39;รอซิงก์&#39; : &#39;รอตรวจ&#39;);
  }

  function submitWorkerReport() {
    const resultLabels = { stable: &#39;อาการคงที่&#39;, better: &#39;ดีขึ้น&#39;, worse: &#39;แย่ลง&#39; };
    const result = root.querySelector(&#39;[data-report-result]&#39;).value;
    const quantity = root.querySelector(&#39;[data-report-quantity]&#39;).value || &#39;0&#39;;
    const unit = root.querySelector(&#39;[data-report-unit]&#39;).value;
    const material = root.querySelector(&#39;[data-report-material]&#39;).value || &#39;ไม่ได้ระบุ&#39;;
    setText(&#39;[data-verify-result]&#39;, resultLabels[result]);
    setText(&#39;[data-verify-quantity]&#39;, `${quantity} ${unit}`);
    setText(&#39;[data-verify-material]&#39;, material);
    setText(&#39;[data-verify-photo]&#39;, photoAdded ? &#39;ภาพจำลอง 1 ภาพ&#39; : &#39;ไม่มีภาพ&#39;);
    if (offline) pendingByFarm[currentFarm] += 1;
    setText(&#39;[data-submit-state]&#39;, offline
      ? `บันทึกในเครื่องแล้ว &#183; รอซิงก์ใน ${farms[currentFarm].code}`
      : &#39;ส่งรายงานแล้ว &#183; รอตรวจ &#183; ข้อมูลจำลอง&#39;);
    resetVerification();
    root.querySelectorAll(&#39;[data-verify-actions] button&#39;).forEach((item) =&gt; { item.disabled = offline; });
    updateSyncIndicator();
    goTo(&#39;manager-verify&#39;);
    showToast(offline ? &#39;บันทึกในเครื่องแล้ว — จะซิงก์เมื่อมีสัญญาณ&#39; : &#39;ส่งรายงานแล้ว — รอผู้จัดการตรวจรับ&#39;);
  }

  function finishVerification(kind, reason = &#39;&#39;) {
    root.querySelector(&#39;[data-verify-actions]&#39;).hidden = true;
    root.querySelector(&#39;[data-rework-form]&#39;).hidden = true;
    const result = root.querySelector(&#39;[data-verification-result]&#39;);
    result.hidden = false;
    if (kind === &#39;approved&#39;) {
      setText(&#39;[data-verify-status]&#39;, &#39;เสร็จแล้ว&#39;);
      setText(&#39;[data-verification-title]&#39;, &#39;อนุมัติรายงานแล้ว&#39;);
      setText(&#39;[data-verification-message]&#39;, &#39;บันทึกผลตรวจรับและ audit event แบบจำลองแล้ว&#39;);
    } else {
      setText(&#39;[data-verify-status]&#39;, &#39;ให้แก้&#39;);
      setText(&#39;[data-verification-title]&#39;, &#39;ส่งกลับให้ Worker แก้ไขแล้ว&#39;);
      setText(&#39;[data-verification-message]&#39;, `เหตุผล: ${reason} &#183; ข้อมูลจำลอง`);
    }
  }

  root.addEventListener(&#39;click&#39;, (event) =&gt; {
    const button = event.target.closest(&#39;button&#39;);
    if (!button) return;

    if (button.dataset.go) goTo(button.dataset.go);

    const action = button.dataset.action;
    if (action === &#39;open-farms&#39;) openFarmPicker();
    if (action === &#39;close-farms&#39;) closeFarmPicker();
    if (action === &#39;open-scan&#39; || action === &#39;scan-for-task&#39;) openScan();
    if (action === &#39;close-scan&#39;) closeScan();
    if (action === &#39;scan-again&#39;) resetScan();
    if (action === &#39;show-tree&#39;) goTo(&#39;tree-detail&#39;);
    if (action === &#39;simulate-scan&#39;) showScanResult(`${farms[currentFarm].code}-Z01-R03-T017`);
    if (action === &#39;open-scanned-tree&#39;) { closeScan(); goTo(&#39;tree-detail&#39;); showToast(&#39;ยืนยันต้นด้วย QR แล้ว&#39;); }
    if (action === &#39;start-report&#39;) { photoAdded = false; setText(&#39;[data-photo-state]&#39;, &#39;ยังไม่มีภาพจำลอง&#39;); goTo(&#39;worker-report&#39;); }
    if (action === &#39;mock-photo&#39;) { photoAdded = true; setText(&#39;[data-photo-state]&#39;, &#39;เพิ่มภาพจำลองแล้ว 1 ภาพ&#39;); showToast(&#39;เพิ่มภาพจำลองแล้ว&#39;); }
    if (action === &#39;submit-report&#39;) submitWorkerReport();
    if (action === &#39;approve-report&#39;) finishVerification(&#39;approved&#39;);
    if (action === &#39;request-rework&#39;) {
      root.querySelector(&#39;[data-rework-form]&#39;).hidden = false;
      root.querySelector(&#39;[data-rework-reason]&#39;).focus();
    }
    if (action === &#39;cancel-rework&#39;) {
      root.querySelector(&#39;[data-rework-form]&#39;).hidden = true;
      root.querySelector(&#39;[data-rework-error]&#39;).hidden = true;
    }
    if (action === &#39;confirm-rework&#39;) {
      const reason = root.querySelector(&#39;[data-rework-reason]&#39;).value.trim();
      if (!reason) {
        root.querySelector(&#39;[data-rework-error]&#39;).hidden = false;
      } else {
        root.querySelector(&#39;[data-rework-error]&#39;).hidden = true;
        finishVerification(&#39;rework&#39;, reason);
      }
    }
    if (action === &#39;cancel-farm-switch&#39;) {
      switchOverlay.hidden = true;
      pendingFarmKey = null;
      showToast(&#39;ยกเลิกการเปลี่ยนสวน — รายการรอซิงก์ยังปลอดภัย&#39;);
    }
    if (action === &#39;confirm-farm-switch&#39; &amp;&amp; pendingFarmKey) applyFarmSwitch(pendingFarmKey, true);

    if (action === &#39;manual-scan&#39;) {
      runManualScan();
    }

    if (action === &#39;toggle-sync&#39;) {
      offline = !offline;
      pendingByFarm[currentFarm] = offline ? Math.max(2, pendingByFarm[currentFarm]) : 0;
      root.querySelectorAll(&#39;[data-offline-banner]&#39;).forEach((banner) =&gt; { banner.hidden = !offline; });
      if (!offline &amp;&amp; currentPage === &#39;manager-verify&#39;) {
        root.querySelectorAll(&#39;[data-verify-actions] button&#39;).forEach((item) =&gt; { item.disabled = false; });
        setText(&#39;[data-verify-status]&#39;, &#39;รอตรวจ&#39;);
        setText(&#39;[data-submit-state]&#39;, `ซิงก์แล้วใน ${farms[currentFarm].code} &#183; รอตรวจ`);
      }
      updateSyncIndicator();
      showToast(offline ? &#39;โหมดจำลองออฟไลน์ — ข้อมูลใหม่จะรอซิงก์&#39; : &#39;กลับมาออนไลน์และซิงก์ข้อมูลแล้ว&#39;);
    }

    if (action === &#39;toggle-theme&#39;) {
      darkMode = !darkMode;
      root.ownerDocument.documentElement.dataset.theme = darkMode ? &#39;dark&#39; : &#39;light&#39;;
      root.style.colorScheme = darkMode ? &#39;dark&#39; : &#39;light&#39;;
      setText(&#39;[data-theme-label]&#39;, darkMode ? &#39;Dark mode&#39; : &#39;Light mode&#39;);
      showToast(darkMode ? &#39;เปิด Dark mode&#39; : &#39;เปิด Light mode&#39;);
    }

    if (button.dataset.selectFarm) {
      requestFarmSwitch(button.dataset.selectFarm);
    }
  });

  farmOverlay.addEventListener(&#39;click&#39;, (event) =&gt; { if (event.target === farmOverlay) closeFarmPicker(); });
  scanOverlay.addEventListener(&#39;click&#39;, (event) =&gt; { if (event.target === scanOverlay) closeScan(); });
  switchOverlay.addEventListener(&#39;click&#39;, (event) =&gt; {
    if (event.target === switchOverlay) {
      switchOverlay.hidden = true;
      pendingFarmKey = null;
    }
  });
  root.addEventListener(&#39;keydown&#39;, (event) =&gt; {
    if (event.key === &#39;Enter&#39; &amp;&amp; event.target.matches(&#39;[data-manual-code]&#39;)) {
      event.preventDefault();
      runManualScan();
    }
    if (event.key === &#39;Escape&#39;) {
      if (!switchOverlay.hidden) { switchOverlay.hidden = true; pendingFarmKey = null; return; }
      if (!scanOverlay.hidden) { closeScan(); return; }
      if (!farmOverlay.hidden) closeFarmPicker();
    }
  });
  applyFarm(currentFarm);
  goTo(currentPage);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
